<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card Generator</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <div class="container py-5">

        <div class="text-center mb-5">
            <h1>Profile Card Generator</h1>
            <p>Create your personalized profile card in seconds.</p>
        </div>

        <div class="row justify-content-center g-5">

            <!-- Profile Form -->
            <div class="col-md-5">

                <div class="form-container">
                    <h3>Create Your Profile</h3>

                    <form id="profileForm">

                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" id="name" class="form-control"
                                placeholder="Enter your name" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Bio</label>
                            <textarea id="bio" class="form-control"
                                placeholder="Write something about yourself"
                                rows="4" required></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Profile Image URL</label>
                            <input type="url" id="image" class="form-control"
                                placeholder="Enter image URL" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Generate Profile
                        </button>

                    </form>

                    <p id="message" class="mt-3 text-center"></p>

                </div>

            </div>


            <!-- Generated Profile -->
            <div class="col-md-5">

                <div class="preview-container">
                    <h3 class="text-center mb-4">Your Profile Card</h3>

                    <div id="profileCard" class="profile-card text-center">

                        <div class="placeholder">
                            <h5>Your profile will appear here!</h5>
                            <p>Fill out the form to generate your card.</p>
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="./js/script.js"></script>

</body>
</html>
